[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repoghost"
version = "0.1.0"
description = "Evidence-backed archaeology for Git repositories"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "RepoGhost Contributors" }
]
dependencies = []

[project.scripts]
repoghost = "repoghost.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"